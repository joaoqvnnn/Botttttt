services:
  - type: web
    name: bellamy-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_LINK
        sync: false
      - key: GROUP_ID
        sync: false
      - key: GROUP_LINK
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: USE_WEBHOOK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: bellamy-db
          property: connectionString

databases:
  - name: bellamy-db
    plan: free
    databaseName: bellamy
    user: bellamy
